<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kad Kahwin Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f4c3a'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='none' stroke='%23c9a24b' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<form id="login" class="login" hidden>
  <h1>Kad Kahwin</h1>
  <p>Sign in to edit your wedding card.</p>
  <input type="password" name="password" placeholder="Admin password" autocomplete="current-password" required autofocus>
  <button class="primary" type="submit">Sign in</button>
  <p class="error" id="loginError" hidden></p>
</form>

<div id="app" hidden>
  <header class="top">
    <strong class="brand">Kad Kahwin</strong>
    <nav class="tabs" id="tabs">
      <button data-tab="content" class="on">Content</button>
      <button data-tab="design">Design</button>
      <button data-tab="sizes">Text size</button>
      <button data-tab="gifts">Gifts</button>
      <button data-tab="rsvps">RSVPs <span class="count" id="rsvpCount"></span></button>
      <button data-tab="settings">Settings</button>
    </nav>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <a class="button" href="/" target="_blank" rel="noopener">View card</a>
    <button class="primary" id="save" disabled>Save changes</button>
  </header>

  <p class="banner" id="pwBanner" hidden>You are still using the default admin password. Change it under Settings before sharing the card.</p>

  <div class="layout" id="layout">
    <main class="editor" id="editor"></main>
    <aside class="preview" id="preview">
      <div class="phone"><iframe id="frame" title="Card preview" src="/?preview=1"></iframe></div>
      <div class="preview-actions">
        <button id="replay">Replay opening</button>
        <span class="hint">Live preview of unsaved changes</span>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/js/shared.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
